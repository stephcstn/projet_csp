# This file is a template, and might need editing before it works on your project.
# This is a sample GitLab CI/CD configuration file that should run without any modifications.
# It demonstrates a basic 3 stage CI/CD pipeline. Instead of real tests or scripts,
# it uses echo commands to simulate the pipeline execution.
#
# A pipeline is composed of independent jobs that run scripts, grouped into stages.
# Stages run in sequential order, but jobs within stages run in parallel.
#
# For more information, see: https://docs.gitlab.com/ee/ci/yaml/#stages
#
# You can copy and paste this template into a new `.gitlab-ci.yml` file.
# You should not add this template to an existing `.gitlab-ci.yml` file by using the `include:` keyword.
#
# To contribute improvements to CI/CD templates, please follow the Development guide at:
# https://docs.gitlab.com/development/cicd/templates/
# This specific template is located at:
# https://gitlab.com/gitlab-org/gitlab/-/blob/master/lib/gitlab/ci/templates/Getting-Started.gitlab-ci.yml

image: debian:latest

# Définition des étapes de la pipeline
stages:
  - build
  - test
  - package

variables:
  # Configuration du Proxy de l'université
  HTTPS_PROXY: "http://cache.univ-poitiers.fr:3128"
  HTTP_PROXY: "http://cache.univ-poitiers.fr:3128"
  
  # Options Maven : On ajoute le dossier local pour le CACHE
  # $CI_PROJECT_DIR est une variable automatique de GitLab qui pointe vers la racine de ton projet
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  MAVEN_CLI_OPTS: "-Dhttp.proxyHost=cache.univ-poitiers.fr -Dhttp.proxyPort=3128 -Dhttps.proxyHost=cache.univ-poitiers.fr -Dhttps.proxyPort=3128"

# LE CACHE : Permet de ne pas retélécharger les librairies Java à chaque fois
cache:
  paths:
    - .m2/repository

# Installation des outils (JDK, Maven, Git) avant chaque job
before_script:
  - apt-get update -y && apt-get install -y default-jdk maven git

build-job:
  stage: build
  script:
    - echo "--- VERIFICATION DE LA SYNCHRO AVEC MAIN ---"
    - git fetch origin main
    - git merge-base --is-ancestor origin/main HEAD || (echo "ERREUR :Votre branche n'est pas à jour. Faites un git merge main !" && exit 1)
    
    - echo "--- NETTOYAGE ET COMPILATION ---"
    - cd proj_csp
    - mvn $MAVEN_CLI_OPTS clean compile
  artifacts:
    paths:
      - proj_csp/target/
    expire_in: 1 week

test-job:
  stage: test
  needs: ["build-job"]
  script:
    - echo "--- RECHERCHE DES TESTS JUNIT 5 ---"
    - cd proj_csp
    - mvn $MAVEN_CLI_OPTS test -Dsurefire.includeJUnit5Engines=junit-jupiter
  artifacts:
    when: always
    paths:
      - proj_csp/target/surefire-reports/
    reports:
      junit: proj_csp/target/surefire-reports/TEST-*.xml

# NOUVEAU JOB : Création du fichier JAR final (le livrable)
package-job:
  stage: package
  needs: ["test-job"]
  script:
    - echo "--- CREATION DU PAQUET (JAR) ---"
    - cd proj_csp
    - rm -f src/main/java/module-info.java
    - mvn $MAVEN_CLI_OPTS package -DskipTests
  artifacts:
    paths:
      - proj_csp/target/*.jar
    expire_in: 1 week